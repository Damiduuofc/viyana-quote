<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viyana Quotation Maker</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quote.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9e6dc;font-family:'Montserrat',Helvetica,Arial,sans-serif;color:#23302f}
  .app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
  .panel{background:#1c3b3a;color:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
  .panel .top{display:flex;align-items:center;gap:12px}
  .panel .top img{width:52px;height:52px;border-radius:6px}
  .panel h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;margin:0;line-height:1.1}
  .panel h1 small{display:block;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#c8c27a;font-weight:600}
  label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c8c27a;font-weight:600;display:block;margin-bottom:6px}
  textarea,input{width:100%;border:1px solid #3b6461;background:#163130;color:#fff;border-radius:8px;padding:10px 12px;font:13px/1.5 'Montserrat','Noto Sans Sinhala',sans-serif}
  textarea{min-height:260px;resize:vertical}
  textarea:focus,input:focus{outline:2px solid #c8c27a;border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:600 13px 'Montserrat',sans-serif;border:0;border-radius:8px;padding:12px 14px;cursor:pointer}
  .primary{background:#c8c27a;color:#1c3b3a}
  .primary:hover{background:#d6d08b}
  .ghost{background:transparent;color:#fff;border:1px solid #3b6461}
  .ghost:hover{border-color:#c8c27a}
  button:disabled{opacity:.6;cursor:wait}
  .status{font-size:12px;min-height:18px;color:#dfe7e5}
  .status.err{color:#ffb4a8}
  .hint{font-size:11px;color:#9fb5b2;line-height:1.5}
  .preview{padding:28px;overflow:auto;display:flex;justify-content:center}
  .scaler{transform-origin:top center}
  .page{box-shadow:0 6px 30px rgba(0,0,0,.18)}
  .empty main{display:flex;align-items:center;justify-content:center}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .panel{position:static;height:auto}
    .preview{padding:16px 0;overflow:hidden}
  }
  @media print{
    body{background:#fff}
    .panel{display:none}
    .app{display:block;min-height:0}
    html,body{height:297mm;overflow:hidden}
    .preview{padding:0;display:block}
    .scaler{transform:none!important;height:auto!important}
    .page{box-shadow:none;margin:0}
    .page [contenteditable]{outline:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="top">
      <img src="logo.png" alt="">
      <h1><small>The Viyana</small>Quotation Maker</h1>
    </div>
    <div>
      <label for="order">Paste order details</label>
      <textarea id="order" placeholder="Paste the menu and price here — English or Sinhala.&#10;&#10;e.g.&#10;Mahamaya girls college&#10;Egg fried rice (Basmathi)&#10;Chicken devilled or Chilli chicken&#10;Vegetable chopsey&#10;680/="></textarea>
    </div>
    <button class="primary" id="gen">Create Quotation</button>
    <div class="status" id="status"></div>
    <div class="row">
      <div><label for="qno">Quotation No.</label><input id="qno"></div>
      <div><label for="qdate">Date</label><input id="qdate" type="date"></div>
    </div>
    <div class="row">
      <button class="ghost" id="print">Download PDF</button>
      <button class="ghost" id="clear">New</button>
    </div>
    <p class="hint">Tip: click any text on the quotation to correct it before downloading. In the print window choose <b>Save as PDF</b>, paper <b>A4</b>, margins <b>None</b>.</p>
  </aside>
  <section class="preview" id="previewWrap">
    <div class="scaler" id="scaler"><div class="page" id="page"></div></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
